version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gym_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: gympass
      POSTGRES_DB: gym_fitness
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
