services:
  - type: web
    name: gymsite-backend
    runtime: node
    repo: https://github.com/vivekkumar860/gymSite
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: gymsite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://gymplannerworkout.netlify.app

databases:
  - name: gymsite-db
    databaseName: gym_fitness
    user: gymuser
    plan: free